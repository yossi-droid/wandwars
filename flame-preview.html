<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blue Flame Preview</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #fff;
        color: #07154f;
        font-family: system-ui, sans-serif;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .label {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        padding: 9px 16px;
        border: 1px solid rgba(33, 72, 190, 0.28);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.82);
        color: #17369d;
        font-size: 13px;
        letter-spacing: 0.04em;
        backdrop-filter: blur(8px);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="label">Drag to rotate · Scroll to zoom · Right-drag to pan</div>
    <script type="module" src="/src/flame-preview.js"></script>
  </body>
</html>
